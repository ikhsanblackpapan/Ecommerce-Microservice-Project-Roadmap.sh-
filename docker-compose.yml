networks:
  ecommerce-network:
    driver: bridge

services:
  # 1. DATABASE SERVICE
  db-apps:
    image: mysql:8.0
    container_name: ecommerce-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      # Kita perintahkan MySQL untuk langsung membuat database utama saat booting
      - MYSQL_DATABASE=db_ecommerce_users 
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network

 # 2. USER SERVICE (Node.js)
  user-service:
    build:
      context: ./user-service  # <--- Menunjuk ke folder kodinganmu
      dockerfile: Dockerfile
    container_name: user-service-app
    restart: always
    environment:
      - PORT=8001
      - DB_HOST=db-apps
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=db_ecommerce_users
      - DATABASE_URL=mysql://root:rootpassword@db-apps:3306/db_ecommerce_users
      - JWT_SECRET=rahasia_super_aman_kamu
    # REKOMENDASI: Tambahkan volumes agar setiap kamu edit server.js langsung sinkron ke Docker tanpa build ulang terus!
    volumes:
      - ./user-service:/app
      - /app/node_modules
    depends_on:
      - db-apps
    networks:
      - ecommerce-network

  # 3. PRODUCT SERVICE (Laravel)
  product-service:
    image: ecommerce-product-service:v1
    container_name: product-service-app
    restart: always
    environment:
      - APP_PORT=8002
      - DB_CONNECTION=mysql
      - DB_HOST=db-apps
      - DB_PORT=3306
      - DB_DATABASE=db_ecommerce_products
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
    depends_on:
      - db-apps
    networks:
      - ecommerce-network

  # 4. API GATEWAY (NGINX)
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway-nginx
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - user-service
      - product-service
    networks:
      - ecommerce-network

# Redis Service
  redis:
    image: redis:alpine
    container_name: redis-apps
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network

# 6. CART SERVICE (Go)
  cart-service:
    build: ./cart-service
    container_name: cart-service-app
    restart: always
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - REDIS_HOST=redis-apps
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - redis
      - rabbitmq
    networks:
      - ecommerce-network



      # 7. ORDER SERVICE (Node.js)
  order-service:
    build: ./order-service
    container_name: order-service-app
    restart: always
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - JWT_SECRET=rahasia_super_aman_kamu
      - DB_HOST=db-apps
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=db_ecommerce_orders
      - DATABASE_URL=mysql://root:rootpassword@db-apps:3306/db_ecommerce_orders
      - CART_SERVICE_URL=http://cart-service:8003
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/ # <-- TAMBAHKAN INI (Ganti localhost jadi rabbitmq)

    volumes:
      - ./order-service:/app
      - /app/node_modules

    depends_on:
      - cart-service
      - db-apps
      - rabbitmq
    networks:
      - ecommerce-network

  # 8. PAYMENT SERVICE (Node.js)
  payment-service:
    build: ./payment-service
    container_name: payment-service-app
    restart: always
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - JWT_SECRET=rahasia_super_aman_kamu
      - DB_HOST=db-apps
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=db_ecommerce_payments
      - ORDER_SERVICE_URL=http://order-service:8004
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/ # <-- REKOMENDASI: Tambahkan juga jika payment service butuh broadcast event lunas
    depends_on:
      - order-service
      - db-apps
      - rabbitmq
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-app
    restart: always
    ports:
      - "5672:5672"   # Port komunikasi AMQP
      - "15672:15672" # Port Management Dashboard Web
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - ecommerce-network


volumes:
  mysql_data:




  